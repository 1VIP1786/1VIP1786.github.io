<!doctype html>
<html lang="en">
<head>
{{ partial "head.html" . }}
<title>404 — Page Not Found | {{ site.Title }}</title>
</head>
<body>
{{ partial "nav.html" . }}
<main>
  <section class="section not-found">
    <p class="eyebrow">404</p>
    <h1 class="h2">Page not found</h1>
    <p class="muted mt-sm">The page you're looking for doesn't exist or has moved.</p>
    <a href="{{ "/" | relURL }}" class="btn btn-primary mt-md">Back to home</a>
  </section>
</main>
{{ partial "footer.html" . }}
</body>
</html>
