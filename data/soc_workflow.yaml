- step: "Alert"
  detail: "A detection fires in Kibana based on defined logic (e.g. encoded PowerShell execution)."
- step: "Triage"
  detail: "Quickly assess alert context — asset, user, time, and severity — to decide urgency."
- step: "Validate"
  detail: "Confirm the alert reflects real activity rather than noise or a misconfigured rule."
- step: "Enrich"
  detail: "Pull related telemetry via ProcessGuid/host correlation — parent process, network, file, registry."
- step: "Investigate"
  detail: "Reconstruct the sequence of events to understand what actually happened on the host."
- step: "Determine Severity"
  detail: "Assess potential impact and likelihood based on the technique and asset criticality."
- step: "Map to ATT&CK"
  detail: "Tag the activity with the relevant tactic/technique for consistent reporting and coverage tracking."
- step: "Contain / Escalate"
  detail: "In a real environment: isolate the host or escalate; in this lab: document the theoretical response."
- step: "Document"
  detail: "Record findings, evidence, and reasoning in a structured investigation write-up."
- step: "Close / Lessons Learned"
  detail: "Note detection gaps, false-positive risk, and tuning opportunities for next time."
