- name: "MITRE ATT&CK"
  blurb: "Used throughout this portfolio as the common language for adversary behavior — every simulated technique above is mapped to a specific ATT&CK ID (tactic → technique → sub-technique) to keep detections grounded in real-world behavior rather than generic alerts."
- name: "NIST Cybersecurity Framework"
  blurb: "Applied as a structuring lens for the lab's overall workflow: Identify (assets/telemetry sources) → Protect (baseline config) → Detect (Sysmon + Elastic) → Respond (investigation playbooks) → Recover (remediation notes)."
- name: "CIS Controls"
  blurb: "Referenced when mapping detection coverage back to concrete safeguards — e.g. logging telemetry maps to CIS Control 8 (Audit Log Management), and the registry/persistence detections map to CIS Control 4 (Secure Configuration)."
- name: "ISO 27001 / ISMS"
  blurb: "Studied and applied at an academic level in the simulated ISMS assessment below — asset inventory, risk register, Statement-of-Applicability-style control mapping, and treatment planning, not a professional implementation engagement."
- name: "OWASP Top 10"
  blurb: "Used as the checklist for the web-security portion of the vulnerability assessment lab when reviewing findings surfaced through Burp Suite."
