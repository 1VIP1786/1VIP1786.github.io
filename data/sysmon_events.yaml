- id: "Event ID 1"
  title: "Process Creation"
  captures: "Every new process: image path, command line, parent process, hashes, user context."
  why: "The single richest signal in the pipeline — almost every attack technique eventually spawns a process."
  suspicious: "Unsigned binaries in Temp/AppData, LOLBins with unusual parents, obfuscated command lines."
- id: "Event ID 3"
  title: "Network Connection"
  captures: "TCP/UDP connections initiated by a process, including source/destination IP and port."
  why: "Ties process activity to network egress — critical for spotting C2 beacons or data exfiltration."
  suspicious: "Non-browser processes calling out to rare destinations, unusual ports, high-frequency beacons."
- id: "Event ID 7"
  title: "Image Loaded"
  captures: "DLLs and modules loaded into a process."
  why: "Surfaces DLL side-loading, injection, and unsigned module abuse."
  suspicious: "Unsigned DLLs loaded from Temp, loads that don't match the process's normal profile."
- id: "Event ID 11"
  title: "File Created"
  captures: "File creation and overwrite events, including path and hash."
  why: "Flags dropped payloads, staged exfiltration data, and persistence artifacts."
  suspicious: "Executables dropped into startup folders, double extensions, archive staging in Temp."
- id: "Event ID 12/13"
  title: "Registry Object Added / Value Set"
  captures: "Creation, deletion, and modification of registry keys and values."
  why: "Core telemetry for persistence (Run keys), defense evasion, and configuration tampering."
  suspicious: "New Run/RunOnce entries, security-tool config keys being modified, unusual key paths."
- id: "Event ID 22"
  title: "DNS Query"
  captures: "DNS queries made by a process and the resolved result."
  why: "One of the earliest indicators of C2 communication or DGA-style domains."
  suspicious: "High-entropy domains, newly registered domains, queries from processes that shouldn't need DNS."
