- technique: "T1059.001"
  tactic: "Execution"
  title: "PowerShell Abuse"
  summary: "Simulated encoded PowerShell execution spawned from a common parent process, investigated end-to-end through process, network, and DNS telemetry."
  telemetry: "Sysmon Event ID 1 (process creation), Event ID 3 (network), Event ID 22 (DNS)"
  finding: "powershell.exe launched with a Base64-encoded (-enc) command line, parented by a process that does not normally spawn PowerShell, followed by an outbound connection to an external IP."
  detectionLogic: "Kibana query flags powershell.exe processes with -enc/-EncodedCommand in the command line, correlated by ProcessGuid to any subsequent network or DNS event within the same process lifetime."
  conclusion: "Consistent with T1059.001 (PowerShell) — encoded command execution used to obscure intent, likely staging for further action."
  response: "Isolate host, decode and review the PowerShell payload, pivot on ProcessGuid to confirm scope, and check the parent process for its own indicators."

- technique: "T1112"
  tactic: "Defense Evasion"
  title: "Registry Modification"
  summary: "Simulated modification of a security-relevant registry key to weaken host defenses, captured through Sysmon registry telemetry."
  telemetry: "Sysmon Event ID 13 (registry value set)"
  finding: "A non-administrative process modified a registry value associated with security tooling configuration shortly after execution."
  detectionLogic: "Detection logic watches TargetObject paths under known security-config and Run-key hives, alerting when the modifying process is not an expected management tool."
  conclusion: "Consistent with T1112 (Modify Registry) — an attempt to alter host configuration to reduce visibility or persist."
  response: "Validate the change against baseline, revert the modified value, and review the modifying process's full execution chain."

- technique: "T1036"
  tactic: "Defense Evasion"
  title: "Masquerading"
  summary: "A process presented itself with the name of a legitimate Windows binary while executing from a non-standard path."
  telemetry: "Sysmon Event ID 1 (process creation), Event ID 7 (image loaded)"
  finding: "Process name matched a trusted system binary (e.g. svchost.exe-style naming) but ran from a user-writable directory instead of System32."
  detectionLogic: "Detection compares process name against expected install path and signer; mismatches between name-based trust and path/signature are flagged."
  conclusion: "Consistent with T1036 (Masquerading) — naming a malicious binary after a trusted process to blend into normal activity."
  response: "Quarantine the binary, hash it for reputation lookup, and check for related persistence or scheduled-task entries."

- technique: "T1053"
  tactic: "Persistence"
  title: "Scheduled Task / Job"
  summary: "A scheduled task was created to re-launch a payload on a recurring trigger, simulating a persistence mechanism."
  telemetry: "Sysmon Event ID 1 (process creation of schtasks.exe), Event ID 11 (file created)"
  finding: "schtasks.exe (or equivalent) created a new task pointing to a binary in a non-standard directory, set to run on logon."
  detectionLogic: "Alert on process creation of task-scheduling utilities with command lines that reference paths outside standard application directories."
  conclusion: "Consistent with T1053 (Scheduled Task/Job) — persistence via the Windows Task Scheduler."
  response: "Remove the scheduled task, trace back to the parent process that created it, and confirm no other persistence mechanisms exist."
