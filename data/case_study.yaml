- title: "1. Alert"
  body: "Kibana detection fires: powershell.exe executed with an encoded command-line argument (-enc)."
- title: "2. Initial Observation"
  body: "The alert references a single host and a single process execution at a specific timestamp."
- title: "3. Relevant Telemetry"
  body: "Sysmon Event ID 1 (process creation), Event ID 3 (network connection), Event ID 22 (DNS query) pulled by ProcessGuid."
- title: "4. Process Tree"
  body: "powershell.exe is confirmed as a child of a process that does not normally launch PowerShell in this environment."
- title: "5. Parent/Child Relationship"
  body: "Parent → PowerShell → no further child processes observed at time of investigation."
- title: "6. Network Activity"
  body: "A single outbound TCP connection from powershell.exe to an external IP shortly after execution."
- title: "7. DNS Activity"
  body: "A DNS query resolving to the same external IP precedes the network connection."
- title: "8. File / Registry Activity"
  body: "No associated file or registry events observed in this simulation — noted as a scope limitation."
- title: "9. ATT&CK Mapping"
  body: "T1059.001 (PowerShell) — Execution tactic."
- title: "10. Severity Assessment"
  body: "Assessed as medium-to-high in a real environment: encoded execution plus external network egress is a strong combined signal."
- title: "11. Analyst Conclusion"
  body: "Behavior is consistent with obfuscated PowerShell execution staging further action, based on encoding, parentage, and network egress."
- title: "12. Recommended Response"
  body: "Isolate host, decode the Base64 payload, review destination IP reputation, and expand the search for the same indicators across other hosts."
- title: "13. Lessons Learned"
  body: "Confirms the value of ProcessGuid-based correlation and highlights the need for file/registry telemetry in future iterations of the lab."
